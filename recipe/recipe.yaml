# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.84.0.20261020"

package:
  name: types-grpcio
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-grpcio/types_grpcio-${{ version }}.tar.gz
  sha256: c918e729e94b37344ffce45fae61139b2ea77ff14efe98e9e7d347d05810a098

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      site_packages:
        - grpc-stubs/__init__.pyi
  - python:
      imports: []
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/python/typeshed
  repository: https://github.com/python/typeshed
  summary: Typing stubs for grpcio
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - laurenzlrz
    - stevenschaererQC
